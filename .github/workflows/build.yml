import 'package:flutter/material.dart';

void main() => runApp(const KSinghApp());

String appLang = "English"; // default

class KSinghApp extends StatelessWidget {
  const KSinghApp({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      theme: ThemeData.dark(),
      home: const LanguageScreen(),
    );
  }
}

// 1. LANGUAGE SELECTION - SABSE PEHLE
class LanguageScreen extends StatefulWidget {
  const LanguageScreen({super.key});
  @override
  State<LanguageScreen> createState() => _LanguageScreenState();
}

class _LanguageScreenState extends State<LanguageScreen> {
  String selected = "English";
  final langs = [
    {"name": "हिन्दी", "sub": "Hindi", "flag": "🇮🇳"},
    {"name": "English", "sub": "English", "flag": "🇺🇸"},
    {"name": "भोजपुरी", "sub": "Bhojpuri", "flag": "🌾"},
    {"name": "اردو", "sub": "Urdu", "flag": "☪️"},
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFF0A0A0F),
      body: SafeArea(
        child: Padding(
          padding: const EdgeInsets.all(20),
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              const SizedBox(height: 20),
              ShaderMask(
                shaderCallback: (b) => const LinearGradient(colors: [Color(0xFF8A2BE2), Color(0xFF00FFFF)]).createShader(b),
                child: const Text("KS", style: TextStyle(fontSize: 50, fontWeight: FontWeight.w900, color: Colors.white)),
              ),
              const SizedBox(height: 10),
              const Text("Apni Bhasha Chune", style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
              const Text("Choose your language", style: TextStyle(color: Colors.grey)),
              const SizedBox(height: 30),
              ...langs.map((lang) {
                bool isSel = selected == lang["sub"];
                return GestureDetector(
                  onTap: () => setState(() => selected = lang["sub"]!),
                  child: Container(
                    margin: const EdgeInsets.only(bottom: 12),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: isSel ? Colors.purple.withOpacity(0.3) : const Color(0xFF1A1A25),
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: isSel ? Colors.purpleAccent : Colors.white12, width: isSel ? 2 : 1),
                    ),
                    child: Row(
                      children: [
                        Text(lang["flag"]!, style: const TextStyle(fontSize: 28)),
                        const SizedBox(width: 16),
                        Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(lang["name"]!, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)), Text(lang["sub"]!, style: const TextStyle(color: Colors.grey, fontSize: 12))]),
                        const Spacer(),
                        if (isSel) const Icon(Icons.check_circle, color: Colors.purpleAccent),
                      ],
                    ),
                  ),
                );
              }).toList(),
              const Spacer(),
              Container(
                width: double.infinity,
                decoration: BoxDecoration(gradient: const LinearGradient(colors: [Colors.purple, Colors.cyan]), borderRadius: BorderRadius.circular(30)),
                child: ElevatedButton(
                  style: ElevatedButton.styleFrom(backgroundColor: Colors.transparent, shadowColor: Colors.transparent, padding: const EdgeInsets.symmetric(vertical: 16)),
                  onPressed: () {
                    appLang = selected;
                    Navigator.push(context, MaterialPageRoute(builder: (_) => const WelcomeScreen()));
                  },
                  child: const Text("Continue →", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}

// 2. WELCOME SCREEN
class WelcomeScreen extends StatelessWidget {
  const WelcomeScreen({super.key});
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFF0A0A0F),
      body: Center(
        child: Padding(
          padding: const EdgeInsets.all(24),
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              ShaderMask(shaderCallback: (b) => const LinearGradient(colors: [Color(0xFF8A2BE2), Color(0xFF00FFFF)]).createShader(b), child: const Text("KS", style: TextStyle(fontSize: 100, fontWeight: FontWeight.w900, color: Colors.white))),
              const SizedBox(height: 10),
              Text(appLang == "हिन्दी" || appLang == "Hindi" ? "Welcome to" : "Welcome to", style: const TextStyle(fontSize: 20, color: Colors.grey)),
              const Text("KSingh App", style: TextStyle(fontSize: 36, fontWeight: FontWeight.bold, color: Colors.purpleAccent)),
              const SizedBox(height: 50),
              Container(width: double.infinity, decoration: BoxDecoration(gradient: const LinearGradient(colors: [Colors.purple, Colors.cyan]), borderRadius: BorderRadius.circular(30)), child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.transparent, shadowColor: Colors.transparent, padding: const EdgeInsets.symmetric(vertical: 16)), onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const LoginScreen())), child: const Text("Get Started →", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)))),
            ],
          ),
        ),
      ),
    );
  }
}

// 3. GOOGLE LOGIN
class LoginScreen extends StatefulWidget {
  const LoginScreen({super.key});
  @override
  State<LoginScreen> createState() => _LoginScreenState();
}
class _LoginScreenState extends State<LoginScreen> {
  bool loading = false;
  void doLogin() async { setState(()=>loading=true); await Future.delayed(const Duration(seconds: 2)); if(mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const MainApp())); }
  @override
  Widget build(BuildContext context) {
    return Scaffold(backgroundColor: const Color(0xFF0A0A0F), body: Center(child: Padding(padding: const EdgeInsets.all(24), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [const Icon(Icons.account_circle, size: 100, color: Colors.purpleAccent), const SizedBox(height: 20), const Text("Login to Continue", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold)), const SizedBox(height: 40), InkWell(onTap: doLogin, child: Container(padding: const EdgeInsets.symmetric(vertical: 14, horizontal: 20), decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(30)), child: Row(mainAxisAlignment: MainAxisAlignment.center, children: const [Icon(Icons.g_mobiledata, color: Colors.black, size: 28), SizedBox(width: 8), Text("Continue with Google", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold))]))), const SizedBox(height: 20), if(loading) const CircularProgressIndicator()]))));
  }
}

// 4. MAIN APP
class MainApp extends StatelessWidget {
  const MainApp({super.key});
  @override
  Widget build(BuildContext context) {
    return Scaffold(backgroundColor: const Color(0xFF0A0A0F), appBar: AppBar(backgroundColor: Colors.black, title: Text("KSingh App • $appLang", style: const TextStyle(color: Colors.purpleAccent))), body: const Center(child: Text("🎉 App Open Ho Gaya!\nLanguage: Selected", textAlign: TextAlign.center, style: TextStyle(fontSize: 20))));
  }
}
              
