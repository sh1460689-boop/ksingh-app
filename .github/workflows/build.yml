
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Manual trigger button ke liye

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 3. Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Dependencies
        run: |
          npm ci || npm install
          npx expo install --fix

      - name: 6. Prebuild Android Native Files
        run: npx expo prebuild --platform android --clean

      - name: 7. Give Gradle Permission
        run: chmod +x android/gradlew

      - name: 8. Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 9. Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: MixApp-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
