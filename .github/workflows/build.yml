<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KSingh App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f1117;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .neon-ks {
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 35%, #ec4899 70%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.45));
    }
    .story-ring {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #4f46e5, #06b6d4);
    }
    .bottom-bar {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.88);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen text-slate-800">

  <!-- Mobile Simulator Frame -->
  <div class="w-full max-w-[430px] min-h-screen bg-white relative flex flex-col shadow-2xl overflow-x-hidden pb-20">

    <!-- Status Bar -->
    <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold">
      <span>9:41</span>
      <div class="flex items-center gap-1.5 text-slate-700">
        <i data-lucide="signal" class="w-3.5 h-3.5"></i>
        <span class="text-[10px] font-bold">5G</span>
        <i data-lucide="battery" class="w-4 h-4 fill-current"></i>
      </div>
    </div>

    <!-- App Header -->
    <header class="px-4 py-2 flex items-center justify-between sticky top-9 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100">
      <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center">
          <span class="text-3xl font-extrabold tracking-tighter neon-ks leading-none">KS</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">KSingh App</h1>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border border-pink-400 text-pink-500 uppercase tracking-wider ml-0.5">PRO</span>
      </div>

      <div class="flex items-center gap-3 text-slate-700">
        <button class="p-1 hover:text-pink-500 transition"><i data-lucide="search" class="w-5 h-5 text-cyan-500"></i></button>
        <button onclick="showToast('No new notifications')" class="relative p-1 hover:text-pink-500 transition">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute 1 top-0 right-0 w-3.5 h-3.5 bg-rose-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">3</span>
        </button>
        <button onclick="showToast('Direct Messages')" class="p-1 hover:text-pink-500 transition">
          <i data-lucide="message-circle" class="w-5 h-5 text-purple-500"></i>
        </button>
      </div>
    </header>

    <!-- Stories Header & List -->
    <section class="mt-3">
      <div class="px-5 mb-2 flex items-center justify-between text-xs font-bold tracking-wider text-slate-400">
        <span>STORIES • TRENDING NOW</span>
      </div>
      <div class="flex gap-3 px-4 overflow-x-auto hide-scrollbar pb-2">
        <!-- Add Story -->
        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
          <div class="w-16 h-16 rounded-full p-[2.5px] border-2 border-pink-500 relative flex items-center justify-center bg-white shadow-sm">
            <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center text-white">
              <i data-lucide="plus" class="w-6 h-6 text-pink-400"></i>
            </div>
          </div>
          <span class="text-[11px] font-medium mt-1.5 text-slate-600">Your Story</span>
        </div>

        <!-- Creator Stories -->
        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer" onclick="showToast('Viewing nova.labs story')">
          <div class="w-16 h-16 rounded-full p-[2.5px] story-ring shadow-sm">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-white" />
          </div>
          <span class="text-[11px] font-medium mt-1.5 text-slate-700">nova.labs</span>
        </div>

        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer" onclick="showToast('Viewing cyberz_ai story')">
          <div class="w-16 h-16 rounded-full p-[2.5px] story-ring shadow-sm">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-white" />
          </div>
          <span class="text-[11px] font-medium mt-1.5 text-slate-700">cyberz_ai</span>
        </div>

        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
          <div class="w-16 h-16 rounded-full p-[2.5px] story-ring shadow-sm">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-white" />
          </div>
          <span class="text-[11px] font-medium mt-1.5 text-slate-700">void.k</span>
        </div>

        <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
          <div class="w-16 h-16 rounded-full p-[2.5px] story-ring shadow-sm">
            <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover rounded-full border-2 border-white" />
          </div>
          <span class="text-[11px] font-medium mt-1.5 text-slate-700">apex_ritual</span>
        </div>
      </div>
    </section>

    <!-- Feed Filter Pills -->
    <div class="flex gap-2 px-4 my-3">
      <button class="flex-1 py-1.5 rounded-full text-xs font-semibold text-white bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-sm shadow-purple-200">For You</button>
      <button class="flex-1 py-1.5 rounded-full text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Following</button>
      <button class="flex-1 py-1.5 rounded-full text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Nearby</button>
    </div>

    <!-- Main Feed Card (Cyberpunk City Post) -->
    <article class="mx-3 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden mb-4">
      <!-- Post Author -->
      <div class="p-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" class="w-9 h-9 rounded-full object-cover border border-purple-400" />
          <div>
            <div class="flex items-center gap-1">
              <span class="font-bold text-xs text-slate-900">@luna.neon</span>
              <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-blue-500 fill-blue-500 text-white"></i>
            </div>
            <p class="text-[10px] text-slate-400">Neo Tokyo • 12m ago</p>
          </div>
        </div>
        <button class="text-slate-400 hover:text-slate-700"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
      </div>

      <!-- Post Media -->
      <div class="relative w-full aspect-video bg-slate-900 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover" />
        <!-- Viral Badge -->
        <div class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center gap-1.5 text-white text-[11px] font-medium border border-white/20">
          <span>🔥 VIRAL</span>
          <span class="text-slate-300">• 1.3M views</span>
        </div>
      </div>

      <!-- Action Buttons Row (Like, Comment, Share, Remix, Download, Save) -->
      <div class="p-3 pb-1 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Like Button -->
          <button onclick="toggleLike(this)" class="flex items-center gap-1 text-slate-700 hover:text-rose-500 transition group">
            <i data-lucide="heart" class="w-5 h-5 heart-icon transition group-hover:scale-110"></i>
            <span class="text-xs font-bold like-count">131.2K</span>
          </button>

          <!-- Comment Button -->
          <button onclick="openModal('commentModal')" class="flex items-center gap-1 text-slate-700 hover:text-blue-500 transition">
            <i data-lucide="message-square" class="w-5 h-5"></i>
            <span class="text-xs font-bold">2.4K</span>
          </button>

          <!-- Share Button -->
          <button onclick="openModal('shareModal')" class="flex items-center gap-1 text-slate-700 hover:text-indigo-500 transition">
            <i data-lucide="send" class="w-5 h-5 -rotate-12"></i>
            <span class="text-xs font-bold">1.1K</span>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <!-- Remix Button -->
          <button onclick="openModal('remixModal')" title="Remix Post" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-purple-50 text-purple-600 hover:bg-purple-100 transition text-[11px] font-bold">
            <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
            <span>Remix</span>
          </button>

          <!-- Download Button -->
          <button onclick="downloadMedia()" title="Download Media" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-700 transition">
            <i data-lucide="download" class="w-5 h-5"></i>
          </button>

          <!-- Save Button -->
          <button onclick="toggleSave(this)" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-700 transition">
            <i data-lucide="bookmark" class="w-5 h-5 save-icon"></i>
          </button>
        </div>
      </div>

      <!-- Caption & Comments -->
      <div class="px-3 pb-3 text-xs">
        <p class="text-slate-800 leading-snug">
          Dropped the new neon city loop ✨ this edit took 40h... pure dreamcore vibes 🦅
          <span class="text-indigo-600 font-semibold cursor-pointer">#cyberpulse #aesthetic #futuristic</span>
        </p>
        <p class="mt-1 text-slate-600">
          <span class="font-bold text-slate-800">apex_ritual:</span> this is absolutely INSANE!! 🔥🔥🔥
        </p>
      </div>
    </article>

    <!-- Secondary Holographic Drop Card -->
    <article class="mx-3 p-3 bg-white rounded-2xl border border-slate-100 shadow-sm mb-4">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" class="w-7 h-7 rounded-full object-cover border border-cyan-400" />
          <div>
            <div class="flex items-center gap-1">
              <span class="font-bold text-xs">@cyberz_ai</span>
              <i data-lucide="check-circle-2" class="w-3 h-3 text-blue-500 fill-blue-500 text-white"></i>
            </div>
            <p class="text-[9px] text-slate-400">AI Art Drop • 1h ago</p>
          </div>
        </div>
        <i data-lucide="more-horizontal" class="w-4 h-4 text-slate-400"></i>
      </div>

      <p class="text-xs font-semibold text-slate-800 mb-2">How we building in 2026 →</p>

      <!-- Gradient Banner Drop -->
      <div class="p-3 rounded-xl bg-gradient-to-r from-purple-50 via-pink-50 to-cyan-50 border border-purple-200/60 mb-2">
        <span class="text-xs font-extrabold bg-gradient-to-r from-pink-600 to-indigo-600 bg-clip-text text-transparent uppercase tracking-wider">GENERATIVE DROP #003</span>
        <p class="text-[11px] text-slate-500 mt-0.5">AI × 3D Concept • 538.9K plays</p>
      </div>

      <div class="flex items-center gap-4 text-slate-600 text-xs font-semibold">
        <button onclick="toggleLike(this)" class="flex items-center gap-1 hover:text-rose-500"><i data-lucide="heart" class="w-4 h-4 heart-icon"></i> 98.6K</button>
        <button onclick="openModal('commentModal')" class="flex items-center gap-1 hover:text-blue-500"><i data-lucide="message-square" class="w-4 h-4"></i> 612</button>
        <button onclick="openModal('shareModal')" class="flex items-center gap-1 hover:text-indigo-500"><i data-lucide="share-2" class="w-4 h-4"></i> 334</button>
      </div>
    </article>

    <!-- Analytics Card (Your Reach) -->
    <div class="mx-3 p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200/50 mb-6 flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 text-xs font-bold text-slate-800">
          <span class="text-amber-500">✨</span>
          <span>Your Reach</span>
        </div>
        <span class="text-xs font-bold text-emerald-600 flex items-center">+42% this week ↑</span>
      </div>
      <p class="text-[11px] text-slate-500">2.5M impressions • 19.1K new followers • trending +18%</p>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bottom-bar border-t border-slate-200/60 py-2.5 px-6 flex items-center justify-between z-40">
      <button class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-indigo-500"><i data-lucide="home" class="w-6 h-6 text-pink-500"></i></button>
      <button class="text-slate-600 hover:text-slate-900"><i data-lucide="search" class="w-6 h-6"></i></button>
      
      <!-- Gradient Add (+) Button -->
      <button onclick="showToast('Create post clicked!')" class="w-11 h-9 rounded-xl bg-gradient-to-tr from-cyan-400 via-indigo-500 to-pink-500 flex items-center justify-center text-white shadow-md shadow-pink-200 active:scale-95 transition">
        <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
      </button>

      <button onclick="showToast('Reels / Shorts tab')" class="text-slate-600 hover:text-slate-900"><i data-lucide="film" class="w-6 h-6"></i></button>
      <button onclick="openModal('welcomeLoginModal')" class="text-slate-600 hover:text-slate-900"><i data-lucide="user" class="w-6 h-6"></i></button>
    </nav>

    <!-- MODAL 1: Welcome & Google Login Modal -->
    <div id="welcomeLoginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl relative animate-in fade-in zoom-in duration-200">
        <button onclick="closeModal('welcomeLoginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-slate-950 flex items-center justify-center shadow-lg shadow-pink-500/20">
          <span class="text-3xl font-black neon-ks">KS</span>
        </div>

        <h2 class="text-xl font-bold text-slate-900">Welcome to KSingh App</h2>
        <p class="text-xs text-slate-500 mt-1 mb-6">Connect with next-gen creators, remix feeds and download clips instantly.</p>

        <!-- Google Sign-In Button -->
        <button onclick="loginWithGoogle()" class="w-full py-3 px-4 border border-slate-300 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-50 transition shadow-sm font-semibold text-xs text-slate-700">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue with Google
        </button>

        <p class="text-[10px] text-slate-400 mt-4">By continuing you accept KSingh terms & privacy policy.</p>
      </div>
    </div>

    <!-- MODAL 2: Comments Drawer -->
    <div id="commentModal" class="hidden fixed inset-0 bg-black/50 z-50 flex flex-col justify-end">
      <div class="bg-white rounded-t-3xl max-w-[430px] w-full mx-auto p-4 max-h-[70vh] flex flex-col">
        <div class="flex items-center justify-between border-b pb-2">
          <span class="font-bold text-sm">Comments (2,410)</span>
          <button onclick="closeModal('commentModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-3 space-y-3 text-xs">
          <div>
            <p class="font-bold text-slate-800">@tech_guy</p>
            <p class="text-slate-600">The neon glow transitions look smooth as butter!</p>
          </div>
          <div>
            <p class="font-bold text-slate-800">@ritika_arts</p>
            <p class="text-slate-600">Remixing this with my music track right now 🎶</p>
          </div>
        </div>
        <div class="pt-2 flex gap-2 border-t">
          <input type="text" placeholder="Add a comment for KSingh..." class="flex-1 bg-slate-100 rounded-full px-4 py-2 text-xs outline-none" />
          <button onclick="showToast('Comment posted!')" class="text-pink-500 font-bold text-xs px-2">Post</button>
        </div>
      </div>
    </div>

    <!-- MODAL 3: Share Drawer -->
    <div id="shareModal" class="hidden fixed inset-0 bg-black/50 z-50 flex flex-col justify-end">
      <div class="bg-white rounded-t-3xl max-w-[430px] w-full mx-auto p-4">
        <div class="flex items-center justify-between border-b pb-2">
          <span class="font-bold text-sm">Share to</span>
          <button onclick="closeModal('shareModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
        </div>
        <div class="grid grid-cols-4 gap-3 py-4 text-center text-xs">
          <button onclick="showToast('Link copied to clipboard!')" class="flex flex-col items-center gap-1.5">
            <div class="w-11 h-11 bg-slate-100 rounded-full flex items-center justify-center text-slate-700"><i data-lucide="link" class="w-5 h-5"></i></div>
            <span>Copy Link</span>
          </button>
          <button onclick="showToast('Shared to WhatsApp')" class="flex flex-col items-center gap-1.5">
            <div class="w-11 h-11 bg-green-100 text-green-600 rounded-full flex items-center justify-center font-bold">WA</div>
            <span>WhatsApp</span>
          </button>
          <button onclick="showToast('Shared to Instagram')" class="flex flex-col items-center gap-1.5">
            <div class="w-11 h-11 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center font-bold">IG</div>
            <span>Instagram</span>
          </button>
          <button onclick="showToast('Shared to Facebook')" class="flex flex-col items-center gap-1.5">
            <div class="w-11 h-11 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold">FB</div>
            <span>Facebook</span>
          </button>
        </div>
      </div>
      
