  @override
  State<LoginPage> createState() => _LoginPageState();
}

class _LoginPageState extends State<LoginPage>
    with SingleTickerProviderStateMixin {
  late AnimationController animation;

  @override
  void initState() {
    super.initState();

    animation = AnimationController(
      vsync: this,
      duration: const Duration(seconds: 5),
    )..repeat();
  }

  @override
  void dispose() {
    animation.dispose();
    super.dispose();
  }

  void login() {
    Navigator.pushReplacement(
      context,
      MaterialPageRoute(
        builder: (_) => const MainPage(),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Stack(
        children: [
          const NeonBackground(),

          Center(
            child: SingleChildScrollView(
              padding: const EdgeInsets.all(25),
              child: Column(
                children: [
                  AnimatedBuilder(
                    animation: animation,
                    builder: (context, child) {
                      return Transform.rotate(
                        angle: animation.value * 0.15,
                        child: child,
                      );
                    },
                    child: const KSINGHLogo(size: 145),
                  ),

                  const SizedBox(height: 30),

                  Text(
                    "KSINGH",
                    style: GoogleFonts.poppins(
                      fontSize: 36,
                      fontWeight: FontWeight.w900,
                      letterSpacing: 4,
                      shadows: const [
                        Shadow(
                          color: Colors.purple,
                          blurRadius: 20,
                        ),
                        Shadow(
                          color: Colors.blue,
                          blurRadius: 30,
                        ),
                      ],
                    ),
                  ),

                  const SizedBox(height: 5),

                  Text(
                    "CREATE • CONNECT • SHARE",
                    style: TextStyle(
                      color: Colors.white.withOpacity(.55),
                      letterSpacing: 2,
                      fontSize: 11,
                    ),
                  ),

                  const SizedBox(height: 45),

                  GlassBox(
                    child: Padding(
                      padding: const EdgeInsets.all(25),
                      child: Column(
                        children: [
                          const Text(
                            "Welcome to KSINGH",
                            style: TextStyle(
                              fontSize: 24,
                              fontWeight: FontWeight.bold,
                            ),
                          ),

                          const SizedBox(height: 8),

                          Text(
                            "Login karke apni duniya se connect karein",
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              color: Colors.white.withOpacity(.55),
                            ),
                          ),

                          const SizedBox(height: 30),

                          GestureDetector(
                            onTap: login,
                            child: Container(
                              height: 58,
                              decoration: BoxDecoration(
                                color: Colors.white,
                                borderRadius: BorderRadius.circular(18),
                                boxShadow: const [
                                  BoxShadow(
                                    color: Colors.purple,
                                    blurRadius: 25,
                                    spreadRadius: -5,
                                  ),
                                  BoxShadow(
                                    color: Colors.blue,
                                    blurRadius: 35,
                                    spreadRadius: -15,
                                  ),
                                ],
                              ),
                              child: Row(
                                mainAxisAlignment:
                                    MainAxisAlignment.center,
                                children: [
                                  Container(
                                    width: 30,
                                    height: 30,
                                    decoration: const BoxDecoration(
                                      shape: BoxShape.circle,
                                      color: Colors.white,
                                    ),
                                    child: const Center(
                                      child: Text(
                                        "G",
                                        style: TextStyle(
                                          color: Color(0xff4285F4),
                                          fontSize: 22,
                                          fontWeight: FontWeight.bold,
                                        ),
                                      ),
                                    ),
                                  ),

                                  const SizedBox(width: 12),

                                  const Text(
                                    "Continue with Google",
                                    style: TextStyle(
                                      color: Colors.black,
                                      fontSize: 15,
                                      fontWeight: FontWeight.w600,
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ),

                          const SizedBox(height: 18),

                          Text(
                            "Fast • Secure • Simple",
