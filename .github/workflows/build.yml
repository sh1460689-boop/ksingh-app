class StoryBar extends StatelessWidget {
  const StoryBar({super.key});

  @override
  Widget build(BuildContext context) {
    final names = [
      "Your Story",
      "Rahul",
      "Neha",
      "Aman",
      "Sara",
      "King",
      "Travel",
    ];

    return SizedBox(
      height: 115,
      child: ListView.builder(
        scrollDirection: Axis.horizontal,
        padding: const EdgeInsets.symmetric(
          horizontal: 10,
        ),
        itemCount: names.length,
        itemBuilder: (context, index) {
          return SizedBox(
            width: 82,
            child: Column(
              children: [
                Container(
                  padding: const EdgeInsets.all(3),
                  decoration: const BoxDecoration(
                    shape: BoxShape.circle,
                    gradient: LinearGradient(
                      colors: [
                        Colors.red,
                        Colors.purple,
                        Colors.blue,
                      ],
                    ),
                  ),
                  child: CircleAvatar(
                    radius: 32,
                    backgroundColor: Colors.black,
                    backgroundImage: NetworkImage(
                      "https://i.pravatar.cc/150?img=${index + 1}",
                    ),
                  ),
                ),

                const SizedBox(height: 6),

                Text(
                  names[index],
                  overflow: TextOverflow.ellipsis,
                  style: const TextStyle(
                    fontSize: 11,
                  ),
                ),
              ],
            ),
          );
        },
      ),
    );
  }
}

// ============================================================
// POST
// ============================================================

class PostCard extends StatefulWidget {
  final String username;
  final String location;
  final String image;
  final String caption;

  const PostCard({
    super.key,
    required this.username,
    required this.location,
    required this.image,
    required this.caption,
  });

  @override
  State<PostCard> createState() => _PostCardState();
}

class _PostCardState extends State<PostCard> {
  bool liked = false;
  bool saved = false;
  bool following = false;

  int likes = 152;

  @override
  Widget build(BuildContext context) {
    return GlassBox(
      margin: const EdgeInsets.fromLTRB(
        10,
        6,
        10,
        14,
      ),
      radius: 22,
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          ListTile(
            leading: CircleAvatar(
              backgroundImage: NetworkImage(
                "https://i.pravatar.cc/150?u=${widget.username}",
              ),
            ),

            title: Text(
              widget.username,
              style: const TextStyle(
                fontWeight: FontWeight.bold,
              ),
            ),

            subtitle: Text(
              widget.location,
              style: TextStyle(
                color: Colors.white.withOpacity(.5),
                fontSize: 11,
              ),
            ),

            trailing: PopupMenuButton(
              itemBuilder: (_) {
                return const [
                  PopupMenuItem(
                    value: "report",
                    child: Text("Report"),
                  ),
                  PopupMenuItem(
                    value: "hide",
                    child: Text("Hide"),
                  ),
                ];
              },
            ),
          ),

          ClipRRect(
            borderRadius: BorderRadius.circular(18),
            child: Image.network(
              widget.image,
              width: double.infinity,
              height: 390,
              fit: BoxFit.cover,
            ),
          ),

          Padding(
            padding: const EdgeInsets.all(12),
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Row(
                  children: [
                    SocialButton(
                      icon: liked
                          ? Icons.favorite
                          : Icons.favorite_border,
                      text: "$likes",
                      color:
                          liked ? Colors.red : Colors.white,
                      onTap: () {
                        setState(() {
                          liked = !liked;

                          if (liked) {
                            likes++;
                          } else {
                            likes--;
                          }
                        });
                      },
                    ),

                    SocialButton(
                      icon: Icons.comment_outlined,
                      text: "32",
                      onTap: () {
                        comments(context);
                      },
                    ),

                    SocialButton(
                      icon: Icons.send_outlined,
                      text: "Share",
                      onTap: () {},
                    ),

                    SocialButton(
                      icon: Icons.repeat,
                      text: "Remix",
                      onTap: () {},
                    ),

                    const Spacer(),

                    IconButton(
                      onPressed: () {
                        setState(() {
                          saved = !saved;
                        });
                      },
                      icon: Icon(
                        saved
                            ? Icons.bookmark
                            : Icons.bookmark_border,
                        color: saved
                            ? Colors.purpleAccent
                            : Colors.white,
                      ),
                    ),
                  ],
                ),

                const SizedBox(height: 6),

                Text(
                  widget.caption,
                  style: const TextStyle(
                    fontSize: 14,
                  ),
                ),

                const SizedBox(height: 10),

                GestureDetector(
                  onTap: () {
                    setState(() {
                      following = !following;
                    });
                  },
                  child: Text(
                    following ? "Following" : "+ Follow",
                    style: TextStyle(
                      color: following
                          ? Colors.white54
                          : Colors.purpleAccent,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }
}

