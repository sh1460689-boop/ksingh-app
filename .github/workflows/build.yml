import 'package:flutter/material.dart';
void main()=>runApp(MaterialApp(debugShowCheckedModeBanner:false,home:MainApp()));
class MainApp extends StatefulWidget{const MainApp({super.key});@override State<MainApp> createState()=>_M();}
class _M extends State<MainApp>{
int i=0;
final p=[Home(),Search(),Reels(),Library(),Profile()];
@override Widget build(BuildContext c){
return Scaffold(
body:p[i],
bottomNavigationBar:BottomNavigationBar(backgroundColor:Colors.black,type:BottomNavigationBarType.fixed,selectedItemColor:Colors.blue,unselectedItemColor:Colors.grey,currentIndex:i,onTap:(v)=>setState(()=>i=v),items:const[
BottomNavigationBarItem(icon:Icon(Icons.home),label:"Home"),
BottomNavigationBarItem(icon:Icon(Icons.search),label:"Search"),
BottomNavigationBarItem(icon:Icon(Icons.play_circle),label:"Reels"),
BottomNavigationBarItem(icon:Icon(Icons.library_books),label:"Library"),
BottomNavigationBarItem(icon:Icon(Icons.person),label:"Profile")]));
}}
Widget top()=>Container(padding:const EdgeInsets.fromLTRB(16,50,16,12),color:const Color(0xFF0A0A0A),child:Row(children:[Container(width:36,height:36,decoration:const BoxDecoration(shape:BoxShape.circle,gradient:LinearGradient(colors:[Color(0xFF00D1FF),Color(0xFFFF00A8)])),child:const Center(child:Text("KS"))),const SizedBox(width:8),const Text("KSingh",style:TextStyle(color:Color(0xFFD4AF37),fontWeight:FontWeight.bold)),const Spacer(),Container(padding:const EdgeInsets.symmetric(horizontal:8,vertical:3),decoration:BoxDecoration(color:Colors.red,borderRadius:BorderRadius.circular(10)),child:const Text("LIVE",style:TextStyle(fontSize:10)))]));
class Home extends StatelessWidget{const Home({super.key});@override Widget build(BuildContext c){return Column(children:[top(),Expanded(child:ListView.builder(itemCount:4,itemBuilder:(c,idx)=>Container(margin:const EdgeInsets.all(10),decoration:BoxDecoration(color:const Color(0xFF121212),borderRadius:BorderRadius.circular(12)),child:Column(children:[Image.network('https://picsum.photos/500/280?random=$idx',height:190,width:double.infinity,fit:BoxFit.cover),ListTile(title:Text(idx==0?"Butter Chicken Recipe":"Naan Tandoor me",style:const TextStyle(fontWeight:FontWeight.bold)),subtitle:const Text("KSingh • 2.1M views"))]))))]);}}
class Search extends StatelessWidget{const Search({super.key});@override Widget build(BuildContext c){return Column(children:[top(),Padding(padding:const EdgeInsets.all(12),child:TextField(decoration:InputDecoration(hintText:"Search",filled:true,fillColor:const Color(0xFF1E1E1E),border:OutlineInputBorder(borderRadius:BorderRadius.circular(30),borderSide:BorderSide.none)))),Expanded(child:ListView.builder(itemCount:8,itemBuilder:(c,i)=>ListTile(title:Text("Butter Naan ${i+1}"))))]);}}
class Reels extends StatelessWidget{const Reels({super.key});@override Widget build(BuildContext c){return Stack(children:[PageView.builder(scrollDirection:Axis.vertical,itemCount:3,itemBuilder:(c,i)=>Image.network('https://picsum.photos/400/800?random=${i+10}',fit:BoxFit.cover,width:double.infinity,height:double.infinity)),const Positioned(right:12,bottom:120,child:Column(children:[Icon(Icons.favorite,size:30),Text("124K"),SizedBox(height:20),Icon(Icons.comment,size:30),Text("8.9K")])),const Positioned(left:16,bottom:20,child:Text("Naan Kitne Watt Tandoor me 🔥"))]);}}
class Library extends StatelessWidget{const Library({super.key});@override Widget build(BuildContext c){return ListView(children:[top(),const Padding(padding:EdgeInsets.all(16),child:Text("Library",style:TextStyle(fontSize:28,fontWeight:FontWeight.bold))),const ListTile(leading:Icon(Icons.favorite,color:Colors.pink),title:Text("Liked Videos")),const ListTile(leading:Icon(Icons.watch_later,color:Colors.purple),title:Text("Watch Later")),const ListTile(leading:Icon(Icons.video_library,color:Colors.blue),title:Text("Your Videos"))]);}}
class Profile extends StatelessWidget{const Profile({super.key});@override Widget build(BuildContext c){return ListView(padding:const EdgeInsets.all(16),children:[top(),const SizedBox(height:20),Row(children:[Expanded(child:Container(height:100,decoration:BoxDecoration(color:const Color(0xFF121212),borderRadius:BorderRadius.circular(12),border:Border.all(color:Colors.blue)),child:const Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.upload,color:Colors.blue),Text("Upload")]))),const SizedBox(width:12),Expanded(child:Container(height:100,decoration:BoxDecoration(color:const Color(0xFF121212),borderRadius:BorderRadius.circular(12),border:Border.all(color:Colors.pink)),child:const Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.live_tv,color:Colors.pink),Text("Go Live")])))] )]);}}
