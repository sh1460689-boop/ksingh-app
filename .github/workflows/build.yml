import 'package:flutter/material.dart';
void main() => runApp(const KSinghApp());
String appLang = 'English';
class KSinghApp extends StatelessWidget {
  const KSinghApp({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(debugShowCheckedModeBanner: false, theme: ThemeData.dark(), home: const LanguageScreen());
  }
}
class LanguageScreen extends StatefulWidget {
  const LanguageScreen({super.key});
  @override State<LanguageScreen> createState() => _LanguageScreenState();
}
class _LanguageScreenState extends State<LanguageScreen> {
  String selected = 'English';
  final langs = [{'name': 'हिन्दी','sub': 'Hindi','flag': '🇮🇳'},{'name': 'English','sub': 'English','flag': '🇺🇸'},{'name': 'भोजपुरी','sub': 'Bhojpuri','flag': '🌾'},{'name': 'اردو','sub': 'Urdu','flag': '☪️'}];
  @override
  Widget build(BuildContext context) {
    return Scaffold(backgroundColor: const Color(0xFF0A0A0F), body: SafeArea(child: Padding(padding: const EdgeInsets.all(20), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
      const SizedBox(height:20), const Text('KS', style: TextStyle(fontSize:60, fontWeight: FontWeight.w900)), const SizedBox(height:10),
      const Text('Apni Bhasha Chune', style: TextStyle(fontSize:28, fontWeight: FontWeight.bold)), const Text('Choose your language', style: TextStyle(color: Colors.grey)), const SizedBox(height:30),
      Expanded(child: ListView.builder(itemCount: langs.length, itemBuilder: (c,i){ final lang=langs[i]; bool isSel=selected==lang['sub']; return GestureDetector(onTap:()=>setState(()=>selected=lang['sub']!), child: Container(margin: const EdgeInsets.only(bottom:12), padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: isSel? Colors.purple.withOpacity(0.3) : const Color(0xFF1A1A25), borderRadius: BorderRadius.circular(16), border: Border.all(color: isSel? Colors.purpleAccent : Colors.white12)), child: Row(children:[Text(lang['flag']!, style: const TextStyle(fontSize:28)), const SizedBox(width:16), Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(lang['name']!, style: const TextStyle(fontSize:18, fontWeight: FontWeight.bold)), Text(lang['sub']!, style: const TextStyle(color:Colors.grey, fontSize:12))]), const Spacer(), if(isSel) const Icon(Icons.check_circle, color: Colors.purpleAccent)]))); })),
      Container(width: double.infinity, decoration: BoxDecoration(gradient: const LinearGradient(colors:[Colors.purple, Colors.cyan]), borderRadius: BorderRadius.circular(30)), child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.transparent, shadowColor: Colors.transparent, padding: const EdgeInsets.symmetric(vertical:16)), onPressed:(){ appLang=selected; Navigator.push(context, MaterialPageRoute(builder:(_)=>const WelcomeScreen())); }, child: const Text('Continue →', style: TextStyle(fontSize:18, fontWeight: FontWeight.bold)))),
    ]))));
  }
}
class WelcomeScreen extends StatelessWidget {
  const WelcomeScreen({super.key});
  @override Widget build(BuildContext context) {
    return Scaffold(backgroundColor: const Color(0xFF0A0A0F), body: Center(child: Padding(padding: const EdgeInsets.all(24), child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[
      const Text('KS', style: TextStyle(fontSize:100, fontWeight: FontWeight.w900)), const Text('Welcome to', style: TextStyle(color:Colors.grey)), const Text('KSingh App', style: TextStyle(fontSize:36, fontWeight: FontWeight.bold, color: Colors.purpleAccent)), Text('Language: $appLang', style: const TextStyle(color: Colors.cyanAccent)), const SizedBox(height:50),
      Container(width: double.infinity, decoration: BoxDecoration(gradient: const LinearGradient(colors:[Colors.purple, Colors.cyan]), borderRadius: BorderRadius.circular(30)), child: ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.transparent, shadowColor: Colors.transparent), onPressed:()=>Navigator.push(context, MaterialPageRoute(builder:(_)=>const LoginScreen())), child: const Text('Get Started →'))),
    ]))));
  }
}
class LoginScreen extends StatefulWidget{const LoginScreen({super.key}); @override State<LoginScreen> createState()=>_LoginScreenState();}
class _LoginScreenState extends State<LoginScreen>{bool loading=false; void doLogin()async{setState(()=>loading=true); await Future.delayed(const Duration(seconds:2)); if(mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const CyberHome()));} @override Widget build(BuildContext context){return Scaffold(backgroundColor: const Color(0xFF0A0A0F), body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[const Icon(Icons.account_circle, size:100, color: Colors.purpleAccent), const Text('Login with Google', style: TextStyle(fontSize:24, fontWeight: FontWeight.bold)), const SizedBox(height:40), InkWell(onTap:doLogin, child: Container(padding: const EdgeInsets.symmetric(vertical:14, horizontal:20), decoration: BoxDecoration(color:Colors.white, borderRadius: BorderRadius.circular(30)), child: const Text('Continue with Google', style: TextStyle(color:Colors.black, fontWeight: FontWeight.bold)))), if(loading) const CircularProgressIndicator()]))) ;}}
class CyberHome extends StatelessWidget{const CyberHome({super.key}); @override Widget build(BuildContext context){return Scaffold(backgroundColor: const Color(0xFF0A0A0F), appBar: AppBar(title: Text('KSingh App • $appLang'), backgroundColor: Colors.black), body: ListView(padding: const EdgeInsets.all(12), children:[Container(padding: const EdgeInsets.all(14), decoration: BoxDecoration(gradient: LinearGradient(colors:[Colors.purple.withOpacity(0.3), Colors.cyan.withOpacity(0.2)]), borderRadius: BorderRadius.circular(20)), child: const Text('KSingh App PRO - Neon Edition')), const SizedBox(height:16), const Text('STORIES • TRENDING NOW', style: TextStyle(color:Colors.cyanAccent)), const SizedBox(height:16), Container(height:220, decoration: BoxDecoration(borderRadius: BorderRadius.circular(16), color: Colors.grey[900]), child: const Center(child: Text('🔥 VIRAL • 1.3M views'))), const SizedBox(height:10), const Text('131.2K likes • 2.4K comments', style: TextStyle(color:Colors.pinkAccent)), const SizedBox(height:20), Container(padding: const EdgeInsets.all(14), decoration: BoxDecoration(gradient: const LinearGradient(colors:[Color(0xFF1A0B2E), Color(0xFF2A1B4D)]), borderRadius: BorderRadius.circular(16)), child: const Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text('✨ Your Reach'), Text('+42% this week ↑', style: TextStyle(color:Colors.greenAccent))]))]), bottomNavigationBar: BottomNavigationBar(backgroundColor: const Color(0xFF0F0F1A), selectedItemColor: Colors.purpleAccent, unselectedItemColor: Colors.grey, type: BottomNavigationBarType.fixed, items: const [BottomNavigationBarItem(icon: Icon(Icons.home), label: ''), BottomNavigationBarItem(icon: Icon(Icons.search), label: ''), BottomNavigationBarItem(icon: Icon(Icons.add_box), label: ''), BottomNavigationBarItem(icon: Icon(Icons.video_library), label: ''), BottomNavigationBarItem(icon: Icon(Icons.person), label: '')]));}}
