const { width } = Dimensions.get('window');

// Stories Data (Glow Rings)
const STORIES = [
  { id: '1', name: 'Your Story', image: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200', isUser: true },
  { id: '2', name: 'nova.labs', image: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200' },
  { id: '3', name: 'cyberz_ai', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=200' },
  { id: '4', name: 'void.k', image: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200' },
