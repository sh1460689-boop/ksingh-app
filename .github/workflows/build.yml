name: Build KSingh Pro APK All-In-One

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Java 17 Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Flutter SDK Setup
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Create Project & Auto-Inject Full Code
        run: |
          # Fresh Flutter Project Initialize karein
          flutter create --org com.ksingh.app --project-name ksingh_app .
          
          # Google Fonts Package Add karein
          flutter pub add google_fonts
          
          # Poora Pro App Code lib/main.dart me likhein
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          void main() {
            runApp(const KSinghProApp());
          }

          class KSinghProApp extends StatelessWidget {
            const KSinghProApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'KSingh App Pro',
                theme: ThemeData(
                  scaffoldBackgroundColor: const Color(0xFFF7F8FA),
                  fontFamily: GoogleFonts.poppins().fontFamily,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepPurple),
                ),
                home: const FeedScreen(),
              );
            }
          }

          class FeedScreen extends StatefulWidget {
            const FeedScreen({super.key});

            @override
            State<FeedScreen> createState() => _FeedScreenState();
          }

          class _FeedScreenState extends State<FeedScreen> {
            int _selectedFilterIndex = 0;
            int _currentNavIndex = 0;

            bool isLiked = false;
            int likeCount = 131200;
            bool isSaved = false;

            final List<String> filters = ["For You", "Following", "Nearby"];

            final List<Map<String, dynamic>> stories = [
              {"name": "Your Story", "isSelf": true},
              {"name": "nova.labs", "isSelf": false},
              {"name": "cyberz_ai", "isSelf": false},
              {"name": "void.k", "isSelf": false},
              {"name": "apex_ritual", "isSelf": false},
            ];

            void _showNotice(String msg) {
              ScaffoldMessenger.of(context).removeCurrentSnackBar();
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(msg),
                  duration: const Duration(seconds: 1),
                  behavior: SnackBarBehavior.floating,
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: SingleChildScrollView(
                    physics: const BouncingScrollPhysics(),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        _buildHeader(),
                        const SizedBox(height: 10),
                        _buildStories(),
                        const SizedBox(height: 12),
                        _buildFilterTabs(),
                        const SizedBox(height: 16),
                        _buildPostCard(),
                        const SizedBox(height: 14),
                        _buildReachCard(),
                        const SizedBox(height: 20),
                      ],
                    ),
                  ),
                ),
                bottomNavigationBar: _buildBottomNav(),
              );
            }

            Widget _buildHeader() {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                child: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF00E5FF), Color(0xFFE040FB)],
                        ),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: const Text(
                        "KS",
                        style: TextStyle(color: Colors.white, fontWeight: FontWeight.w900, fontSize: 18),
                      ),
                    ),
                    const SizedBox(width: 10),
                    Text(
                      "KSingh App",
                      style: GoogleFonts.poppins(fontSize: 20, fontWeight: FontWeight.w800),
                    ),
                    const SizedBox(width: 8),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                      decoration: BoxDecoration(
                        border: Border.all(color: const Color(0xFFE040FB), width: 1.5),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: const Text(
                        "PRO",
                        style: TextStyle(color: Color(0xFFE040FB), fontSize: 10, fontWeight: FontWeight.bold),
                      ),
                    ),
                    const Spacer(),
                    IconButton(
                      icon: const Icon(Icons.search, size: 24),
                      onPressed: () => _showNotice("Search opened"),
                    ),
                    IconButton(
                      icon: const Icon(Icons.notifications_none_rounded, size: 24),
                      onPressed: () => _showNotice("3 New Notifications"),
                    ),
                    IconButton(
                      icon: const Icon(Icons.chat_bubble_outline_rounded, size: 22),
                      onPressed: () => _showNotice("Chats opened"),
                    ),
                  ],
                ),
              );
            }

            Widget _buildStories() {
              return SizedBox(
                height: 95,
                child: ListView.builder(
                  scrollDirection: Axis.horizontal,
                  padding: const EdgeInsets.symmetric(horizontal: 12),
                  itemCount: stories.length,
                  itemBuilder: (context, index) {
                    final s = stories[index];
                    return Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 6),
                      child: Column(
                        children: [
                          Container(
                            padding: const EdgeInsets.all(2.5),
                            decoration: const BoxDecoration(
                              shape: BoxShape.circle,
                              gradient: LinearGradient(
                                colors: [Color(0xFF00E5FF), Color(0xFFE040FB)],
                              ),
                            ),
                            child: CircleAvatar(
                              radius: 28,
                              backgroundColor: Colors.grey.shade300,
                              child: Icon(
                                s["isSelf"] ? Icons.person_add_alt_1 : Icons.person,
                                color: Colors.purple.shade900,
                                size: 28,
                              ),
                            ),
                          ),
                          const SizedBox(height: 4),
                          Text(s["name"], style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w600)),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            Widget _buildFilterTabs() {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 16),
                child: Container(
                  padding: const EdgeInsets.all(4),
                  decoration: BoxDecoration(
                    color: Colors.grey.shade200,
                    borderRadius: BorderRadius.circular(25),
                  ),
                  child: Row(
                    children: List.generate(filters.length, (i) {
                      final active = _selectedFilterIndex == i;
                      return Expanded(
                        child: GestureDetector(
                          onTap: () => setState(() => _selectedFilterIndex = i),
                          child: Container(
                            padding: const EdgeInsets.symmetric(vertical: 8),
                            decoration: BoxDecoration(
                              gradient: active
                                  ? const LinearGradient(colors: [Color(0xFF8A54FF), Color(0xFFE040FB)])
                                  : null,
                              borderRadius: BorderRadius.circular(20),
                            ),
                            child: Center(
                              child: Text(
                                filters[i],
                                style: TextStyle(
                                  fontWeight: FontWeight.bold,
                                  fontSize: 12,
                                  color: active ? Colors.white : Colors.black87,
                                ),
                              ),
                            ),
                          ),
                        ),
                      );
                    }),
                  ),
                ),
              );
            }

            Widget _buildPostCard() {
              return Container(
                margin: const EdgeInsets.symmetric(horizontal: 14),
                decoration: BoxDecoration(
                  color: Colors.white,
                  borderRadius: BorderRadius.circular(20),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black.withOpacity(0.04),
                      blurRadius: 10,
                      offset: const Offset(0, 4),
                    )
                  ],
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const ListTile(
                      leading: CircleAvatar(
                        backgroundColor: Colors.purpleAccent,
                        child: Icon(Icons.person, color: Colors.white),
                      ),
                      title: Row(
                        children: [
                          Text("@luna.neon", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                          SizedBox(width: 4),
                          Icon(Icons.verified, size: 15, color: Colors.blueAccent),
                        ],
                      ),
                      subtitle: Text("Neo Tokyo • 12m ago", style: TextStyle(fontSize: 11)),
                      trailing: Icon(Icons.more_horiz),
                    ),

                    Container(
                      height: 220,
                      margin: const EdgeInsets.symmetric(horizontal: 12),
                      decoration: BoxDecoration(
                        borderRadius: BorderRadius.circular(16),
                        gradient: const LinearGradient(
                          colors: [Color(0xFF0F2027), Color(0xFF203A43), Color(0xFF2C5364)],
                        ),
                      ),
                      child: Stack(
                        children: [
                          const Center(
                            child: Icon(Icons.play_circle_fill_rounded, size: 64, color: Colors.white70),
                          ),
                          Positioned(
                            bottom: 12,
                            left: 12,
                            child: Container(
                              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                              decoration: BoxDecoration(
                                color: Colors.black87,
                                borderRadius: BorderRadius.circular(20),
                              ),
                              child: const Text(
                                "🔥 VIRAL • 1.3M views",
                                style: TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.bold),
                              ),
                            ),
                          )
                        ],
                      ),
                    ),

                    const SizedBox(height: 10),

                    // 6 Action Buttons: Like, Comment, Share, Remix, Download, Save
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 8),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          // LIKE
                          IconButton(
                            icon: Icon(
                              isLiked ? Icons.favorite : Icons.favorite_border,
                              color: isLiked ? Colors.pink : Colors.black87,
                            ),
                            onPressed: () {
                              setState(() {
                                isLiked = !isLiked;
                                likeCount += isLiked ? 1 : -1;
                              });
                            },
                          ),
                          // COMMENT
                          IconButton(
                            icon: const Icon(Icons.chat_bubble_outline),
                            onPressed: () => _showNotice("Comments dialog opened"),
                          ),
                          // SHARE
                          IconButton(
                            icon: const Icon(Icons.send_rounded),
                            onPressed: () => _showNotice("Share link copied!"),
                          ),
                          // REMIX (Reels / YouTube Shorts Remix)
                          IconButton(
                            tooltip: "Remix",
                            icon: const Icon(Icons.auto_awesome, color: Colors.purple),
                            onPressed: () => _showNotice("Remixing Video & Audio Studio opened!"),
                          ),
                          // DOWNLOAD
                          IconButton(
                            tooltip: "Download",
                            icon: const Icon(Icons.file_download_outlined, color: Colors.blueAccent),
                            onPressed: () => _showNotice("Video downloading started..."),
                          ),
                          // SAVE
                          IconButton(
                            tooltip: "Save",
                            icon: Icon(isSaved ? Icons.bookmark : Icons.bookmark_border),
                            onPressed: () {
                              setState(() => isSaved = !isSaved);
                              _showNotice(isSaved ? "Saved to Bookmark!" : "Removed from Saved");
                            },
                          ),
                        ],
                      ),
                    ),

                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 4),
                      child: Text(
                        "Dropped the new neon city loop ✨ pure dreamcore vibes #cyberpulse #aesthetic",
                        style: TextStyle(color: Colors.grey.shade800, fontSize: 12.5),
                      ),
                    ),
                    const SizedBox(height: 12),
                  ],
                ),
              );
            }

            Widget _buildReachCard() {
              return Container(
                margin: const EdgeInsets.symmetric(horizontal: 14),
                padding: const EdgeInsets.all(12),
                decoration: BoxDecoration(
                  color: const Color(0xFFFFF9E6),
                  borderRadius: BorderRadius.circular(16),
                  border: Border.all(color: const Color(0xFFFFE082)),
                ),
                child: const Row(
                  children: [
                    Icon(Icons.trending_up, color: Colors.amber, size: 28),
                    SizedBox(width: 10),
                    Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text("Your Reach +42% this week ↑", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                        Text("2.5M impressions • 19.1K new followers", style: TextStyle(fontSize: 10, color: Colors.black54)),
                      ],
                    )
                  ],
                ),
              );
            }

            Widget _buildBottomNav() {
              return BottomNavigationBar(
                currentIndex: _currentNavIndex,
                onTap: (i) => setState(() => _currentNavIndex = i),
                type: BottomNavigationBarType.fixed,
                selectedItemColor: const Color(0xFFE040FB),
                unselectedItemColor: Colors.black54,
                items: const [
                  BottomNavigationBarItem(icon: Icon(Icons.home), label: "Home"),
                  BottomNavigationBarItem(icon: Icon(Icons.search), label: "Search"),
                  BottomNavigationBarItem(icon: Icon(Icons.add_box_rounded), label: "Create"),
                  BottomNavigationBarItem(icon: Icon(Icons.video_library_outlined), label: "Shorts"),
                  BottomNavigationBarItem(icon: Icon(Icons.person_outline), label: "Profile"),
                ],
              );
            }
          }
          EOF

      - name: 5. Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSingh-Pro-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
