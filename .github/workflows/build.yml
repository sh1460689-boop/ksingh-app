class MainPage extends StatefulWidget {
  const MainPage({super.key});

  @override
  State<MainPage> createState() => _MainPageState();
}

class _MainPageState extends State<MainPage> {
  int page = 0;

  final screens = const [
    HomePage(),
    ReelsPage(),
    CreatePage(),
    SearchPage(),
    ProfilePage(),
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      extendBody: true,
      body: screens[page],
      bottomNavigationBar: KSINGHBottomBar(
        selected: page,
        onChanged: (value) {
          setState(() {
            page = value;
          });
        },
      ),
    );
  }
}

